# 개요 D25: 앱은 frontend·backend 둘뿐이고 공용 코드 패키지는 두지 않는다.
# 폴더는 M0-04·05에서 만든다. 아직 없어도 install은 실패하지 않는다.
packages:
  - 'frontend'
  - 'backend'

# 개요 §2.1: 의존성은 정확한 버전으로 고정한다. `pnpm add`가 ^·~를 붙이지 않게 한다.
savePrefix: ''

# 설치 스크립트 실행 거부 목록 (pnpm 12는 검토 안 된 빌드 스크립트가 있으면 설치를 실패시킨다).
# - @scarf/scarf: swagger-ui-dist의 전이 의존성. 스크립트가 텔레메트리라 동작에 필요 없다.
# - @parcel/watcher: jest-haste-map의 전이 의존성. 스크립트는 네이티브 빌드 폴백이고,
#   `jest --watch`에서만 쓰이며 플랫폼별 사전 빌드 패키지로 충분하다.
# - ssh2·cpu-features: testcontainers(dockerode) 전이 의존성. ssh2 스크립트는 선택적 네이티브
#   암호 바인딩 빌드(실패해도 순수 JS로 동작)이고 cpu-features는 그 선택 의존성이다.
#   Docker에 ssh:// 로 접속할 때만 쓰이며 로컬 소켓 접속에는 필요 없다.
# - protobufjs: dockerode 전이 의존성. postinstall은 버전 표기 경고만 출력한다.
# - prisma: preinstall은 지원하지 않는 Node 버전이면 경고하고 끝내는 검사뿐이다(.nvmrc로 고정).
# - esbuild: tsx(seed 실행) 의존성. postinstall은 플랫폼 바이너리 패키지(optionalDependencies로
#   이미 설치됨)가 있는지 확인·검증만 한다. 꺼진 상태에서 tsx 동작을 확인했다.
#
# 설치 스크립트 실행 허용 목록 (동작에 필요).
# - @prisma/engines: postinstall이 설치 시점에 schema-engine 바이너리(migrate·db 명령용)를 내려받는다.
#   끄면 첫 CLI 실행 때 내려받으므로 오프라인 실행·CI 캐시가 불안정해진다.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@parcel/watcher': false
  'cpu-features': false
  esbuild: false
  prisma: false
  protobufjs: false
  ssh2: false
