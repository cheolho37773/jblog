name: 작업
description: WBS 작업 1건 (작업 1개 = 브랜치 1개 = PR 1개)
title: "[WBS-ID] 작업 요약"
body:
  - type: input
    id: wbs
    attributes:
      label: WBS ID
      description: 예) BE-05-1, FE-07, SEC-03
    validations:
      required: true
  - type: input
    id: brief
    attributes:
      label: 작업 지시서
      description: 예) docs/work/M3/tasks/BE-05-1.md
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 실행 방식
      options:
        - 단일 실행
        - 서브에이전트 조합
        - 공유 계약 변경
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 완료 기준 (필수 검증)
      description: 성공 · 거부 · 회귀 시나리오
      value: |
        - [ ]
    validations:
      required: true
